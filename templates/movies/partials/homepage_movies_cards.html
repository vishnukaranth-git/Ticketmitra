{% for movie in homepage_movies %}
  {% include 'movies/partials/categorized_movie_card.html' with movie=movie %}
{% empty %}
<div class="p-4 text-center w-100" style="color: var(--text-warmstone-sub); min-height: 200px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
  <i class="fas fa-film mb-2" style="font-size: 28px; opacity: 0.5;"></i>
  <p class="mb-0">No bookable showtimes scheduled for this selection right now.</p>
  <small class="text-muted mt-1">Showtimes update automatically when scheduled.</small>
</div>
{% endfor %}
